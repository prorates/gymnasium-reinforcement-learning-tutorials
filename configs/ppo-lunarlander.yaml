# rl-baselines3-zoo's tuned LunarLander hyperparameters. total_timesteps was picked by
# measuring, not by taste — see the table in PPOSettings. 600k lands reliably (+240) and
# takes about 93s on CPU; 200k gets to roughly break-even.
demo: ppo-lunarlander

total_timesteps: 600000
learning_rate: 0.0003
n_steps: 1024
batch_size: 64
gae_lambda: 0.98
gamma: 0.999
n_epochs: 4
ent_coef: 0.01
episodes: 5
