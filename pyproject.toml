[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl-tutorials"
version = "0.1.0"
description = "Gymnasium reinforcement-learning tutorial demos, running on Apple Silicon"
readme = "README.md"

# Floor 3.13: newest interpreter the stack resolves on. Cap <3.14 is NOT hygiene —
# gymnasium[box2d] 1.3.0 depends on box2d==2.3.10, which publishes wheels through cp313
# and none for cp314, so a 3.14 resolve fails outright:
#
#   Because box2d==2.3.10 has no wheels with a matching Python ABI tag (e.g., `cp314`)
#   and gymnasium[box2d]>=1.3.0 depends on box2d==2.3.10, ...requirements are unsatisfiable.
#
# This matters because 3.14 is the default `python3` on the machine this was built for;
# without the cap, uv picks it and the failure reads as "gymnasium is broken".
# Gymnasium's unreleased main routes >=3.14 to box2d-py + swig (a source build), so revisit
# when a release carries that marker.
requires-python = ">=3.13,<3.14"

dependencies = [
    # box2d -> LunarLander/BipedalWalker; atari -> ALE (ROMs ship inside the ale-py wheel);
    # classic-control -> CartPole rendering.
    "gymnasium[atari,box2d,classic-control]>=1.3.0,<2.0",
    "ale-py>=0.12.1",
    "matplotlib>=3.10",
    "pyyaml>=6.0",
    "stable-baselines3>=2.9.0",
    "torch>=2.8",
]

[project.scripts]
rl-tutorials = "rl_tutorials.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.16",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rl_tutorials"]

[tool.ruff]
line-length = 100
# 100 matches the formatting of the class-M files claude-meta broadcasts. Without it ruff
# defaults to 88 and `pre-commit run --all-files` reformats all 31 delivered files,
# guaranteeing a conflict on the next broadcast.
#
# Those same trees are excluded from LINTING (not from `format --check`, which they pass):
# they are meta-owned, arrive by broadcast, and any fix we make here becomes a 3-way
# conflict on the next delivery. A finding in them goes to `/alemax:feedback`, not to a
# local edit. 96 of the 100 findings on the first run lived here.
extend-exclude = [".venv"]

[tool.ruff.lint]
exclude = ["bin/**", ".claude/**"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
files = ["src/rl_tutorials", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Third-party only — never our own package.
module = ["ale_py.*", "stable_baselines3.*", "matplotlib.*", "IPython.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
